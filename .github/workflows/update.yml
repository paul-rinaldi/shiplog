name: update leaderboard

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  push:
    branches: [main]
    paths: [friends.json, config.json, scripts/fetch.mjs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: fetch stats
        env:
          # Optional SHIPLOG_TOKEN secret (fine-grained PAT, public read only).
          # Falls back to the built-in Actions token, which works for public data.
          GITHUB_TOKEN: ${{ secrets.SHIPLOG_TOKEN || github.token }}
        run: node scripts/fetch.mjs

      - name: commit if changed
        run: |
          git config user.name  "shiplog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json site/history.json
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "chore: update leaderboard"
          git pull --rebase origin main
          git push
